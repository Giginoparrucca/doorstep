# Owner-provisioned and verified 2026-10-26. Since 2026-10-30 it also runs
# automatically after every green regression run on main (owner request);
# the Production environment restricts the credential to main.
name: production security smoke
on:
  workflow_dispatch:
  workflow_run:
    workflows: [regression]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-security-smoke
  cancel-in-progress: false
jobs:
  production-live:
    # Manual runs from main, or automatic runs after a successful push-to-main
    # regression run (never after pull-request runs).
    if: >-
      vars.ROUND65_PRODUCTION_ENV_READY == 'true' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The exact commit that passed regression (automatic) or the invoking main commit (manual).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the locked tools before exposing the database credential
        run: npm ci
      - name: Require the protected server credential and run read-only production gates
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_SERVICE_ROLE_KEY }}
          # Preflight the pending Round 66 migration before its source PR merges.
          # This adds a required name; main-only checkout/review/credentials stay intact.
          SCHEMA_DRIFT_REQUIRED_MIGRATIONS: '["round66_atomic_submissions","round66_chat_history_guard","round66_host_entry_audit"]'
          SPOT_SMOKE_ORIGIN: https://app.welcomebnb.it
          TAX_SMOKE_ORIGIN: https://app.welcomebnb.it
          SECURITY_SMOKE_ORIGIN: https://app.welcomebnb.it
          CHAT_SMOKE_ORIGIN: https://app.welcomebnb.it
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Protected production credential is missing"; exit 1; }
          npm run test:live
