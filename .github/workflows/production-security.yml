# Owner-provisioned and verified 2026-10-26; every run requires owner review.
name: production security smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-security-smoke
  cancel-in-progress: false
jobs:
  production-live:
    if: github.ref == 'refs/heads/main' && vars.ROUND65_PRODUCTION_ENV_READY == 'true'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install the locked tools before exposing the database credential
        run: npm ci
      - name: Require the protected server credential and run read-only production gates
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_SERVICE_ROLE_KEY }}
          # Preflight the pending Round 66 migration before its source PR merges.
          # This adds a required name; main-only checkout/review/credentials stay intact.
          SCHEMA_DRIFT_REQUIRED_MIGRATIONS: '["round66_atomic_submissions"]'
          SPOT_SMOKE_ORIGIN: https://app.welcomebnb.it
          TAX_SMOKE_ORIGIN: https://app.welcomebnb.it
          SECURITY_SMOKE_ORIGIN: https://app.welcomebnb.it
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Protected production credential is missing"; exit 1; }
          npm run test:live
