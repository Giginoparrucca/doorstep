# Round 60a Phase 1 — full regression suite.
# Runs on every PR and every push to main. Blocks the merge if any
# test file reports a failure. Skips (exit 77 + "SKIP <reason>" on
# stderr, POSIX convention) are counted but do not fail the gate.
name: regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project devDependencies
        run: npm install

      - name: Install Playwright + Chromium
        # 1.56.x pins the version the local-dev image uses, so CI and
        # local runs behave the same. Playwright stays out of
        # package.json devDependencies to keep local installs lean.
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run full regression (npm run test:all)
        run: |
          npm run test:all 2>&1 | tee /tmp/test-all.log
          exit ${PIPESTATUS[0]}

      - name: Schema-drift guard against production
        # Round 60b Phase 2 — Reads supabase_migrations.schema_migrations
        # on prod via the SECURITY DEFINER RPC and fails if any committed
        # supabase/migrations/*.sql file has no matching applied row.
        # Catches the Round 57 failure mode (committed file, never applied).
        # Skips (exit 77) when the secret is not available on a fork PR,
        # which is counted but does not fail the gate.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run test:live 2>&1 | tee /tmp/test-live.log
          exit ${PIPESTATUS[0]}

      - name: Comment failure to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### regression CI failure (run ${GITHUB_RUN_ID})"
            echo ""
            echo "<details><summary>test:all tail</summary>"
            echo ""
            echo '```'
            tail -200 /tmp/test-all.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo "</details>"
          } > /tmp/comment.md
          gh api --method POST "repos/${REPO}/issues/${PR}/comments" \
            -F body=@/tmp/comment.md
