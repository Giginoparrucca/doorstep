# Round 60a Phase 1 — full regression suite.
# Runs on every PR and every push to main. Blocks the merge if any
# test file reports a failure. Skips (exit 77 + "SKIP <reason>" on
# stderr, POSIX convention) are counted but do not fail the gate.
name: regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install project devDependencies
        run: npm ci

      - name: Verify locked install is clean
        run: git diff --exit-code -- package.json package-lock.json

      - name: Bound Ubuntu package downloads and use official mirrors
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if test -f /etc/apt/apt-mirrors-security.txt; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-welcomebnb-network >/dev/null

      - name: Install pinned Playwright Chromium
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 60000
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Install XML schema validator
        run: python -m pip install lxml==6.0.2

      - name: Run full regression (npm run test:all)
        run: |
          npm run test:all 2>&1 | tee /tmp/test-all.log
          exit ${PIPESTATUS[0]}

      - name: Public production smoke without server credentials
        # Privileged grants/schema drift require the reviewed main-only workflow
        # production-security.yml. PR code never receives a production key.
        env:
          SPOT_SMOKE_ORIGIN: https://app.welcomebnb.it
          TAX_SMOKE_ORIGIN: https://app.welcomebnb.it
          SECURITY_SMOKE_ORIGIN: https://app.welcomebnb.it
        run: |
          npm run test:live 2>&1 | tee /tmp/test-live.log
          exit ${PIPESTATUS[0]}

      - name: Comment failure to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### regression CI failure (run ${GITHUB_RUN_ID})"
            echo ""
            echo "<details><summary>test:all tail</summary>"
            echo ""
            echo '```'
            tail -200 /tmp/test-all.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo "</details>"
          } > /tmp/comment.md
          gh api --method POST "repos/${REPO}/issues/${PR}/comments" \
            -F body=@/tmp/comment.md
